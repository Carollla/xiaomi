create_gridmap_node:
  ceres_param:
    max_num_iterations: 20
    num_threads: 1
    occupied_space_weight: 10.0
    rotation_weight: 40.0
    translation_weight: 20.0
    use_nonmonotonic_steps: false
  create_map_path: /home/nav/lidar_data_collection/mapping
  filter_param:
    max_angle_radians: 0.0175
    max_distance_meters: 0.2
    max_length: 0.05
    max_time_seconds: 160
    min_num_points: 200
    voxel_filter_size: 0.025
  laser_to_baselink:
    position:
    - 0.0
    - 0.0
    - 0.0
    quaternion:
    - 0.0
    - 0.0
    - 0.0
    - 1.0
  mapbeauti:
    approx_poly_thresh: 0.01
    dilate_kernel_size: 3
    noise_removal_thresh: 100
    side_fill_thresh: 0.3
  probability_param:
    p_free: 0.45
    p_occ: 0.55
    p_prior: 0.5
  submap_param:
    initx: 100
    inity: 100
    max_range: 8.0
    min_range: 0.2
    missing_data_ray_length: 6.0
    num_accumulated: 35
    resolution: 0.05
    sizex: 100
    sizey: 100
